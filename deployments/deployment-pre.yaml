apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyecto-changeme #Only change "changeme"
  namespace: changeme-pre #NAMESPACE
spec:
  revisionHistoryLimit: 3
  selector:
   matchLabels:
    app: proyecto-changeme #Only change "changeme"
  replicas: 1
  template:
    metadata:
      labels:
        app: proyecto-changeme #Only change "changeme"
    spec:
      initContainers:
      - name: init-chown
        image: busybox
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          chown -R www-data:www-data /mnt/public_content &&
          chown -R www-data:www-data /mnt/private_content &&
          chmod -R 770 /mnt/public_content &&
          chmod -R 770 /mnt/private_content
        volumeMounts:
        - name: public-content
          mountPath: /mnt/public_content
        - name: private-content
          mountPath: /mnt/private_content
      containers:
      - name: proyecto-changeme #Only change "changeme"
        image: sistemasudec/pifod:simplesaml-pre #Docker Image
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: SOURCE
          value: pre-pifod #Environment variable
        - name: ENDPOINT
          value: mysql-pifod #Environment variable
        - name: DATABASE
          value: proyecto #Environment variable
        - name: USERD
          value: user #Environment variable
        - name: PASSD
          valueFrom:
            secretKeyRef:
              name: proyecto-secret #doesn't need a change, it's the statefulset secret
              key: proyecto-password  #doesn't need a change, it's the statefulset secret
        - name: SIMPLE 
          value: simple-pifod #Enviroment variable
        volumeMounts:
        - name: public-content
          mountPath: /var/www/pifod/public_content
        - name: private-content
          mountPath: /var/www/private_content
      volumes:
      - name: public-content
        persistentVolumeClaim:
          claimName: public-content-pvc
      - name: private-content
        persistentVolumeClaim:
          claimName: private-content-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: proyecto-changeme #Only change "changeme"
  namespace: changeme-pre #NAMESPACE
  labels:
    app: proyecto-changeme #Only change "changeme"
spec:
  selector:
   app: proyecto-changeme #Only change "changeme"
  type: ClusterIP
  ports:
   - name: http
     port: 80
     protocol: TCP
     targetPort: 80
